name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Zip extension
        run: cd build && zip -r ../digiwage-wallet-extension.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiwage-wallet-extension
          path: |
            build/
            digiwage-wallet-extension.zip
          if-no-files-found: error
